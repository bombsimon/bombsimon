<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
  <title>Hi, I'm Simon Sawert. My border was a fuse.</title>
  <defs>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#fff3c4"/>
      <stop offset="0.35" stop-color="#ffb000" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ff5a00" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blast">
      <stop offset="0" stop-color="#fffbe6"/>
      <stop offset="0.4" stop-color="#ffb000" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ff3d00" stop-opacity="0"/>
    </radialGradient>
    <path id="fuse" d="M 2 292 V 8 Q 2 2 8 2 H 892 Q 898 2 898 8 V 232 Q 898 244 886 246"/>
  </defs>

  <g>
    <animateTransform attributeName="transform" type="translate" begin="6.5s" dur="0.45s" fill="freeze"
      values="0 0; -7 4; 6 -5; -4 3; 2 -1; 0 0"/>

    <!-- Intact card, swapped for broken pieces when the bomb goes off -->
    <g>
      <set attributeName="opacity" to="0" begin="6.5s" fill="freeze"/>
      <rect x="2" y="2" width="896" height="296" rx="6" fill="none" stroke="#3d444d" stroke-width="2"/>
      <path d="M 2 292 V 8 Q 2 2 8 2 H 892 Q 898 2 898 8 V 232 Q 898 244 886 246" fill="none" stroke="#9a4a12" stroke-width="3" pathLength="100"
        stroke-dasharray="100 100" stroke-dashoffset="100">
        <animate attributeName="stroke-dashoffset" from="100" to="0" begin="2s" dur="4.5s" fill="freeze"/>
      </path>
      <g transform="translate(866 266)">
        <circle r="22" fill="#21262d" stroke="#656c76" stroke-width="2"/>
        <rect x="9" y="-24" width="12" height="9" rx="2" transform="rotate(40)" fill="#3d444d"/>
        <path d="M -9 -8 a 12 12 0 0 1 8 -6" stroke="#9198a1" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.6"/>
      </g>
    </g>

    <!-- The spark riding the border -->
    <g opacity="0">
      <set attributeName="opacity" to="1" begin="2s"/>
      <set attributeName="opacity" to="0" begin="6.5s" fill="freeze"/>
      <animateMotion begin="2s" dur="4.5s" fill="freeze" rotate="0">
        <mpath href="#fuse"/>
      </animateMotion>
      <circle r="14" fill="url(#glow)">
        <animate attributeName="r" values="11;16;9;14;11" dur="0.3s" repeatCount="indefinite"/>
      </circle>
      <circle r="3" fill="#fffbe6"/>
    </g>

    <!-- Broken border pieces -->
    <g opacity="0" fill="none" stroke-width="2" stroke-linecap="round">
      <set attributeName="opacity" to="1" begin="6.5s" fill="freeze"/>
      <path d="M 2 292 V 8 Q 2 2 8 2 H 430" stroke="#7a3c12">
        <animateTransform attributeName="transform" type="rotate" values="0 430 2; -4 430 2; -2.8 430 2"
          keyTimes="0; 0.7; 1" begin="6.5s" dur="0.6s" fill="freeze"/>
      </path>
      <path d="M 446 2 H 892 Q 898 2 898 8 V 120" stroke="#7a3c12">
        <animateTransform attributeName="transform" type="rotate" values="0 446 2; 9 446 2; 6.5 446 2"
          keyTimes="0; 0.7; 1" begin="6.5s" dur="0.6s" fill="freeze"/>
      </path>
      <path d="M 898 136 V 230" stroke="#7a3c12">
        <animateTransform attributeName="transform" type="translate" values="0 0; -70 50; -46 36"
          keyTimes="0; 0.6; 1" begin="6.5s" dur="0.7s" fill="freeze"/>
        <animateTransform attributeName="transform" type="rotate" values="0 898 180; -40 898 180; -32 898 180"
          keyTimes="0; 0.6; 1" begin="6.5s" dur="0.7s" fill="freeze" additive="sum"/>
      </path>
      <path d="M 8 298 Q 2 298 2 292 M 8 298 H 610" stroke="#3d444d">
        <animateTransform attributeName="transform" type="rotate" values="0 8 298; 1.2 8 298; 0.8 8 298"
          keyTimes="0; 0.7; 1" begin="6.5s" dur="0.6s" fill="freeze"/>
      </path>
      <path d="M 628 298 H 800" stroke="#3d444d">
        <animateTransform attributeName="transform" type="rotate" values="0 628 298; -16 628 298; -12 628 298"
          keyTimes="0; 0.6; 1" begin="6.5s" dur="0.6s" fill="freeze"/>
      </path>
      <path d="M 840 300 l 8 -14 l 6 10 l 10 -16" stroke="#7a3c12" stroke-width="1.5"/>
    </g>

    <!-- Blast and smoke -->
    <circle cx="866" cy="266" r="0" fill="url(#blast)">
      <animate attributeName="r" values="0;190;230" keyTimes="0;0.6;1" begin="6.5s" dur="0.6s" fill="freeze"/>
      <animate attributeName="opacity" values="1;0.9;0" keyTimes="0;0.4;1" begin="6.5s" dur="0.6s" fill="freeze"/>
    </circle>
    <g fill="#6e7681" opacity="0">
      <set attributeName="opacity" to="0.35" begin="6.6s"/>
      <circle cx="850" cy="270" r="14">
        <animate attributeName="cy" from="270" to="150" begin="6.6s" dur="3s" fill="freeze"/>
        <animate attributeName="r" from="10" to="34" begin="6.6s" dur="3s" fill="freeze"/>
        <animate attributeName="opacity" from="1" to="0" begin="6.6s" dur="3s" fill="freeze"/>
      </circle>
      <circle cx="878" cy="262" r="12">
        <animate attributeName="cy" from="262" to="120" begin="6.8s" dur="3.4s" fill="freeze"/>
        <animate attributeName="r" from="8" to="28" begin="6.8s" dur="3.4s" fill="freeze"/>
        <animate attributeName="opacity" values="0;1;0" begin="6.6s" dur="3.6s" fill="freeze"/>
      </circle>
      <circle cx="830" cy="280" r="10">
        <animate attributeName="cy" from="280" to="170" begin="7s" dur="3s" fill="freeze"/>
        <animate attributeName="r" from="6" to="24" begin="7s" dur="3s" fill="freeze"/>
        <animate attributeName="opacity" values="0;1;0" begin="6.6s" dur="3.4s" fill="freeze"/>
      </circle>
    </g>

    <!-- Content, knocked crooked by the blast -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 300 150; -4 300 150; -2.2 300 150"
        keyTimes="0; 0.5; 1" begin="6.55s" dur="0.7s" fill="freeze"/>
      <text x="70" y="104" font-size="40" fill="#f0f6fc" font-weight="300">Hi 👋, I’m</text>
      <text x="70" y="178" font-size="68" fill="#f0f6fc" font-weight="700">Simon Sawert</text>
      <text x="72" y="232" font-size="26" fill="#9198a1" opacity="0">I still don’t have a bio.
        <animate attributeName="opacity" from="0" to="1" begin="7.6s" dur="0.6s" fill="freeze"/>
      </text>
    </g>
    <text x="40" y="280" font-size="19" fill="#d29922" opacity="0"
      font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">border.go:1:1: explosions should never be cuddled (wsl)
      <animate attributeName="opacity" from="0" to="1" begin="8.6s" dur="0.4s" fill="freeze"/>
    </text>
  </g>
</svg>
